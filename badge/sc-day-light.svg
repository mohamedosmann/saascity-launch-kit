<svg xmlns="http://www.w3.org/2000/svg" width="270" height="80" viewBox="0 0 270 80" fill="none">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;display=swap');
      .brand-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .award-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
    </style>
  </defs>

  <!-- Card Border & Background -->
  <rect x="0.75" y="0.75" width="268.5" height="78.5" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  
  <!-- Ribbon Icon Group (Vertically Centered: Top of circle is 20, bottom of tails is 60, center is 40) -->
  <g>
    <!-- Left Ribbon Tail (Darker Blue) -->
    <path d="M 27 34 L 18 59 L 27 54 L 32 57 L 32 34 Z" fill="#1D4ED8" />
    <!-- Right Ribbon Tail (Lighter Blue) -->
    <path d="M 49 34 L 58 59 L 49 54 L 44 57 L 44 34 Z" fill="#3B82F6" />
    
    <!-- Outer Ring / Circle -->
    <circle cx="38" cy="36" r="16" fill="#3B82F6" />
    
    <!-- Inner Circle -->
    <circle cx="38" cy="36" r="12" fill="#1D4ED8" />
    
    <!-- Star -->
    <polygon points="38,28.8 40.35,33.55 45.57,34.31 41.79,38 42.68,43.2 38,40.74 33.32,43.2 34.21,38 30.43,34.31 35.65,33.55" fill="#FFFFFF" />
  </g>

  <!-- Text Group (Left-aligned for natural spacing) -->
  <text x="72" y="32" class="brand-text">
    <tspan fill="#3B82F6">SaaS</tspan><tspan fill="#09090B">City</tspan><tspan fill="#3B82F6">.io</tspan>
  </text>
  
  <text x="72" y="57" fill="#2563EB" class="award-text">#1 Project of the Day</text>
</svg>
